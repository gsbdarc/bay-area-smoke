name: Refresh data

# Monthly, not daily, on purpose: EPA regenerates its bulk files roughly twice a
# year and the AQS API backfill moves slowly. Polling daily would burn Actions
# minutes rewriting byte-identical files. Use workflow_dispatch during an active
# fire season when you want the current-year numbers now.
on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st. Off-the-hour: GitHub delays runs at :00.
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed JSON
  pages: write      # deploy it
  id-token: write   # OIDC for deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Refresh only the cheap, fast-moving stages. The ECHOLab bootstrap is a
      # one-time job run on a server -- its output is committed to the repo and
      # this workflow never re-downloads 1.8 GB.
      - name: Refresh recent data
        env:
          AQS_EMAIL: ${{ secrets.AQS_EMAIL }}
          AQS_KEY: ${{ secrets.AQS_KEY }}
        run: python run_all.py --refresh-only

      - name: Verify against known events
        run: python run_all.py --verify

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed site/data
          if git diff --staged --quiet; then
            echo "No upstream changes; nothing to commit."
          else
            git commit -m "data: refresh $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      # Deploy in THIS run. A push made with GITHUB_TOKEN does not trigger
      # other workflows, so deploy.yml would never fire from the commit above.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
